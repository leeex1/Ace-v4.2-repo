# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# This version is specifically tailored for the Quillan-Ronin AI architecture,
# accounting for Python deep learning dependencies, custom tokenizers, and
# safety-critical code paths.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. 
# Please check the `language` matrix defined below to confirm you have the correct 
# set of supported CodeQL languages.

name: "Quillan-Ronin Security Scan (CodeQL Advanced)"

on:
  push:
    branches: ["main", "release/*"]
  pull_request:
    branches: ["main"]
  schedule:
    # Runs at 02:22 UTC every Tuesday (aligned with weekly security cadence)
    - cron: "22 2 * * 2"

jobs:
  analyze:
    name: Analyze Quillan-Ronin (${{ matrix.language }})
    
    # Use larger runners for Python AI workloads to prevent timeout
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import quillan_bpe_tokenizer; import quillan_fused_optimizer; print('Quillan modules verified successfully.')"

      # --- Initialize CodeQL Databases ---
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
          upload-tag-prefix: codeql-v${{ github.sha }}

      # --- Upload Artifacts for Review ---
      - name: Upload SARIF File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-${{ matrix.language }}
          path: .github/codeql/*.sarif.json
          retention-days: 90

