<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Holographic Cyber-Ronin Oni Helmet | Three.js</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#040711; overflow:hidden; width:100vw; height:100vh; font-family:sans-serif; }
    .hud { position:absolute; top:14px; left:14px; color:#00f0ff; background:rgba(4,7,17,0.85); padding:8px 14px; border-radius:6px; border:1px solid rgba(0,240,255,0.4); z-index:10; }
    .hud-title { font-size:13px; font-weight:bold; }
    .hud-sub { font-size:10px; color:#94a3b8; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">👹 Holographic Cyber-Ronin Oni Helmet</div>
    <div class="hud-sub">Faceted 3D Oni mask with glowing golden cyber horns and tracking crimson visual sensors</div>
  </div>
  <div id="c" style="width:100%; height:100%;"></div>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('c').appendChild(renderer.domElement);

    const mask = new THREE.Group();
    scene.add(mask);

    // Helm Visor
    const helmGeo = new THREE.IcosahedronGeometry(1.8, 1);
    const helmWire = new THREE.Mesh(helmGeo, new THREE.MeshPhongMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.85 }));
    const helmSolid = new THREE.Mesh(helmGeo, new THREE.MeshBasicMaterial({ color: 0x021526, transparent: true, opacity: 0.5 }));
    mask.add(helmWire);
    mask.add(helmSolid);

    // Horns
    const hornGeo = new THREE.TorusGeometry(1.0, 0.12, 8, 20, Math.PI * 0.75);
    const hornMat = new THREE.MeshPhongMaterial({ color: 0xffd700, wireframe: true });
    const hornL = new THREE.Mesh(hornGeo, hornMat);
    hornL.position.set(-1.2, 1.2, 0.2);
    hornL.rotation.z = Math.PI * 0.4;
    const hornR = new THREE.Mesh(hornGeo, hornMat);
    hornR.position.set(1.2, 1.2, 0.2);
    hornR.rotation.z = -Math.PI * 0.4;
    hornR.rotation.y = Math.PI;
    mask.add(hornL);
    mask.add(hornR);

    // Glowing Crimson Eyes
    const eyeGeo = new THREE.BoxGeometry(0.5, 0.12, 0.2);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.6, 0.3, 1.5);
    const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
    eyeR.position.set(0.6, 0.3, 1.5);
    mask.add(eyeL);
    mask.add(eyeR);

    camera.position.z = 6;
    const light = new THREE.PointLight(0x00f0ff, 3, 20);
    light.position.set(3, 4, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x111122));

    function animate(t) {
      requestAnimationFrame(animate);
      const time = t * 0.001;
      mask.rotation.y = Math.sin(time * 0.8) * 0.45;
      mask.rotation.x = Math.cos(time * 0.6) * 0.2;
      mask.position.y = Math.sin(time * 1.5) * 0.2;
      renderer.render(scene, camera);
    }
    animate(0);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
